server {
    listen 80;
    listen [::]:80;
    # Initial launch uses the VPS IP. Replace with the RZWire domain and add
    # TLS only when DNS is ready.
    server_name 137.74.160.38;

    root /var/www/rzwire/frontend/dist;
    index index.html;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        # OpenRouter image generation commonly takes longer than nginx's
        # 60-second default. Keep the browser connection alive until the
        # backend can return the finished base64 image.
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
